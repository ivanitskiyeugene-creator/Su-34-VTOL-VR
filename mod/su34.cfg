# Лётная модель Су-34. Правь числа и перезапускай игру — пересобирать не нужно.
# Всё, что после '#' — комментарий. Дробная часть через точку.

# Масса ПУСТОГО самолёта, кг. Топливо и подвески игра добавляет сама.
# Нормальный взлётный вес Су-34 — 39 000 кг, максимальный — 45 000.
emptymasskg = 22500

# Тяга двух АЛ-31ФМ1 в ньютонах.
# 13 500 кгс — полный форсаж, 8 250 кгс — «малый газ / максимал без форсажа».
# 13 500 × 9.80665 × 2 = 264 780 Н; 8 250 × 9.80665 × 2 = 161 810 Н.
thrustabn = 264780
thrustdryn = 161810

# Площадь крыла и размах — по ним считается аэродинамика.
wingaream2 = 62.0
wingspanm = 14.7

# Предельная перегрузка. Реальный Су-34 держит +7 g.
glimit = 7.0

# Необязательные множители на «отзывчивость» рулей (1.0 = как у донора).
# Это вкусовое: 0.9 — плавнее, 1.1 — резче. На реализм не влияет.
pitchauthority = 1.0
rollauthority = 1.0
yawauthority = 1.0


# ── Посадка экипажа ────────────────────────────────────────────────────────
# Кресла стоят на местах, измеренных по самому мешу Су-34. Если в игре голова
# окажется слишком низко/высоко/далеко от приборов — сдвинь кресло здесь и
# перезапусти миссию (пересобирать бандл не нужно).
# x — вправо, y — вверх, z — вперёд (к носу). В метрах, можно отрицательные.
seatpilotx = 0.00
seatpiloty = 0.00
seatpilotz = 0.00
seatwsox = 0.00
seatwsoy = 0.00
seatwsoz = 0.00
