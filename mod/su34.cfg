# Su-34 flight tuning. Edit the numbers, restart the game.
# Lines starting with '#' are ignored. Values are plain decimals with a dot.

# Empty weight of the aircraft in kilograms. The donor aircraft is lighter,
# this is what makes the Su-34 feel heavy on the runway and in the turn.
masskg = 26000

# Multiplier applied to engine thrust. 1.0 = same as the donor aircraft.
thrustscale = 1.10

# Multipliers for the flight assist PIDs. Below 1 = softer, above 1 = snappier.
pitchauthority = 0.95
rollauthority = 0.92
yawauthority = 1.05
